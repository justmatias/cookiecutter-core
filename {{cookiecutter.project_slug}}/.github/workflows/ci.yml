name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, edited]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-title:
    name: Standardize PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-generate conventional PR title
        env:
          GH_TOKEN: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: {{ '${{' }} github.repository }}
          PR_NUMBER: {{ '${{' }} github.event.pull_request.number }}
          CURRENT_TITLE: {{ '${{' }} github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if echo "$CURRENT_TITLE" | grep -qE "$PATTERN"; then
            echo "Title already conventional, skipping."
            exit 0
          fi
          FIRST_COMMIT_SUBJECT=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[0].commit.message' | head -1)
          if echo "$FIRST_COMMIT_SUBJECT" | grep -qE "$PATTERN"; then
            NEW_TITLE="$FIRST_COMMIT_SUBJECT"
          else
            NEW_TITLE="chore: $FIRST_COMMIT_SUBJECT"
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$NEW_TITLE"

      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: {{ '${{' }} secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (Python {{ '${{' }} matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{% for v in cookiecutter.python_versions.split(',') %}'{{ v.strip() }}'{% if not loop.last %}, {% endif %}{% endfor %}]
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: {{ '${{' }} github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: {{ '${{' }} matrix.python-version }}

      - name: Run lint and format checks
        id: format
        continue-on-error: true
        run: uv run poe format

      - name: Commit autofixed formatting issues
        if: steps.format.outcome == 'failure' && github.event_name == 'pull_request' && matrix.python-version == '{{ cookiecutter.python_version }}'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: apply automated formatting fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail if lint or format issues were found
        if: steps.format.outcome == 'failure'
        run: exit 1

  test:
    name: Test (Python {{ '${{' }} matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{% for v in cookiecutter.python_versions.split(',') %}'{{ v.strip() }}'{% if not loop.last %}, {% endif %}{% endfor %}]
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: {{ '${{' }} matrix.python-version }}

      - name: Run unit tests
        run: uv run poe test

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '{{ cookiecutter.python_version }}'

      - name: Run pip-audit
        run: uvx pip-audit --local

  update-hooks:
    name: Update pre-commit hooks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: {{ '${{' }} github.head_ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '{{ cookiecutter.python_version }}'

      - name: Autoupdate pre-commit hooks
        run: uv run pre-commit autoupdate

      - name: Sync uv additional dependencies
        run: uv run pre-commit run hookpin --all-files || true

      - name: Commit updated hooks
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore(config): update pre-commit hooks"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

  breaking-changes:
    name: Detect breaking changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '{{ cookiecutter.python_version }}'

      # Use uvx rather than `pipx run`: pipx resolves the runner image's
      # preinstalled uv from the tool cache instead of the version pinned by
      # setup-python-env, and fails when that one is older than pipx requires.
      # uvx always uses the pinned uv already on PATH.
      - name: Get proposed version
        id: proposed
        run: |
          VERSION=$(uvx --from python-semantic-release semantic-release --noop version --print)
          echo "proposed=$VERSION" >> $GITHUB_OUTPUT

      - name: Run pycracks
        id: pycracks
        continue-on-error: true
        run: |
          uvx pycracks \
            --path "tests" \
            --target-version "{{ '${{' }} steps.proposed.outputs.proposed }}" \
            --test-command "uv run poe test"

      - name: Create breaking change commit
        if: steps.pycracks.outcome == 'failure'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty \
            -m "feat!: breaking change detected [skip ci]"
          git push origin main

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [breaking-changes]
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '{{ cookiecutter.python_version }}'

      - name: Bump version and update changelog
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

    outputs:
      released: {{ '${{' }} steps.release.outputs.released }}
      version: {{ '${{' }} steps.release.outputs.version }}

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.versioning.outputs.released == 'true'
    needs: [versioning]
    environment:
      name: pypi
      url: https://pypi.org/p/{{ cookiecutter.project_slug }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: {{ '${{' }} secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '{{ cookiecutter.python_version }}'

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
