name: Template CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  smoke-test:
    name: Generate and validate project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install cookiecutter
        run: uv tool install cookiecutter

      - name: Generate project from template
        run: uv tool run cookiecutter . --no-input --output-dir /tmp/generated

      - name: Initialize git repo in generated project
        working-directory: /tmp/generated/my-awesome-project
        run: |
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add -A
          git commit -q -m "chore: initial commit"

      - name: Install generated project dependencies
        working-directory: /tmp/generated/my-awesome-project
        run: uv sync --all-groups

      - name: Lint and format generated project
        working-directory: /tmp/generated/my-awesome-project
        run: uv run poe format

      - name: Test generated project
        working-directory: /tmp/generated/my-awesome-project
        run: uv run poe test
